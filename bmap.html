<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>赣鄱智轨</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- 1) 先加载配置（含 BMAP_AK + 线路/站点数据） -->
  <script src="js/config.js"></script>
  <!-- 2) 加载模块一基座逻辑（initMap 等） + 各功能模块 -->
  <script src="js/map-base.js"></script>
  <script src="js/heatmap.js"></script>
  <script src="js/agent-panel.js"></script>
  <script src="js/emergency.js"></script>
  <script src="js/train-sim.js"></script>
  <script src="js/transfer-sim.js"></script>
  <script src="js/app.js"></script>
  <!-- 3) 注入百度地图 JSAPI GL（AK 取自 config.js 的 window.GanpoConfig.BMAP_AK）
       ★ 必须用 document.write 在"HTML 解析阶段"同步注入 ★
       为什么不能改成动态 createElement('script')：
       百度 api 返回的脚本内部使用 document.write() 二次追加 getscript。
       动态插入的 script 默认是 async，一旦它加载完成时文档已解析结束，
       其内部的 document.write() 会触发隐式 document.open()，把整页清空
       → 表现为【白屏 / 地图完全不生成】。解析阶段的 document.write 则安全，
       且仍可继续从 config.js 动态读取 AK。 -->
  <script>
    (function () {
      var ak = (window.GanpoConfig && window.GanpoConfig.BMAP_AK) || '';
      document.write(
        '<script type="text/javascript" src="//api.map.baidu.com/api?type=webgl&v=1.0&ak=' +
        encodeURIComponent(ak) + '"><\/script>'
      );
    })();
  </script>
</head>
<body>
  <div id="app">
    <!-- 地图底座 -->
    <div id="map_container"></div>

    <!-- 顶部标题 + 模块导航（app.js 动态构建 6 模块快捷按钮） -->
    <div id="topbar">
      <div class="brand">赣鄱智轨 <small>江西省通勤-旅游复合轨道</small></div>
      <div id="module-nav"></div>
    </div>

    <!-- 图例 -->
    <div id="legend">
      <div class="item"><span class="swatch" style="background:#ffcc00"></span>通勤层（既有铁路公交化 · 黄）</div>
      <div class="item"><span class="swatch" style="background:#ff3344"></span>旅游层（轮轨+齿轨双制式单轨 · 红）</div>
      <div class="item"><span class="swatch" style="background:#00d4ff"></span>站点（圆点 + 站名一一对应）</div>
      <div class="item"><span class="swatch" style="background:#ffffff"></span>原大巴通行（白点移动 · 随所属层显隐）</div>
      <div class="item"><span class="swatch" style="background:#ff8800"></span>齿轨爬坡段（橙色闪烁）</div>
      <div class="item"><span class="swatch" style="background:#4fa8d8"></span>设区市行政区划（市级划分）</div>
      <div class="item"><span class="swatch" style="background:#888888"></span>百度实时路况（按需开启：红=拥堵 / 黄=缓行 / 绿=畅通）</div>
    </div>
  </div>

  <!-- 热力 / 列车 / 智能体面板 / 换乘 / 应急 的工具栏与面板均由各模块 JS 自行创建，
       此处无需预置容器。 -->

  <!-- 4) 等 DOM 就绪后再初始化地图。
       ★ 不能在 head 里提前调用 ★
       原写法在脚本 onload 时立刻 initMap()，若百度脚本加载快于 body 解析，
       此时 #map_container 尚不存在，new BMapGL.Map('map_container') 直接失败。
       改为 DOMContentLoaded 后调用，保证容器一定存在。 -->
  <script>
    (function () {
      function boot() {
        if (window.initMap) {
          window.initMap();
        } else {
          console.error('[赣鄱智轨] initMap 未定义，map-base.js 可能未加载成功。');
        }
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', boot);
      } else {
        boot();
      }
    })();
  </script>
</body>
</html>
